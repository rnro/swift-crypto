name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.16
    with:
      # Named because a concurrency group is keyed on it, and this workflow calls
      # the reusable workflows more than once.
      name: tests

      # Per-version arguments are one object rather than an input per version; a
      # plain string is the argument list.
      linux_version_overrides: |
        6.1: --explicit-target-dependency-import-check error
        6.2: --explicit-target-dependency-import-check error
        6.3: --explicit-target-dependency-import-check error
        nightly-release: --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error
      windows_version_overrides: |
        6.1: --explicit-target-dependency-import-check error
        6.2: --explicit-target-dependency-import-check error
        6.3: --explicit-target-dependency-import-check error
        nightly-release: --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error

      # macOS runs on the nightly pool here, unlike the pull-request workflow.
      enable_macos: true
      macos_repository_owner: apple
      macos_runner_pool: nightly
      xcode_scheme: swift-crypto-Package
      macos_swift_versions: '["6.1", "6.2", "6.3"]'
      macos_xcode_versions: '["latest-beta"]'
      # A bare list takes every target's defaults: build, and do not test.
      xcode_targets: '[macOS, iOS, watchOS, tvOS, visionOS]'

      # Job kinds that were a workflow each.
      linux_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      windows_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      enable_cxx_interop: true
      enable_linux_static_sdk_build: true
