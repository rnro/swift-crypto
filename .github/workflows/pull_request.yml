name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.7
    with:
      license_header_check_project_name: "SwiftCrypto"
      docs_check_enabled: false

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.16
    with:
      # Named because a concurrency group is keyed on it, and this workflow calls
      # the reusable workflows more than once.
      name: tests

      # Per-version arguments are one object rather than an input per version; a
      # plain string is the argument list. The 5.10 override the old workflow
      # carried is dropped: the manifest needs 6.1, and minimum-version detection
      # from Package.swift would filter it out regardless.
      linux_version_overrides: |
        6.1: --explicit-target-dependency-import-check error
        6.2: --explicit-target-dependency-import-check error
        6.3: --explicit-target-dependency-import-check error
        nightly-release: --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error
      windows_version_overrides: |
        6.1: --explicit-target-dependency-import-check error
        6.2: --explicit-target-dependency-import-check error
        6.3: --explicit-target-dependency-import-check error
        nightly-release: --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error

      # macOS. The two version lists combine, so the Xcode beta runs alongside the
      # release toolchains, as macos_tests.yml's independent enable flags did.
      enable_macos: true
      macos_repository_owner: apple
      macos_runner_pool: general
      xcode_scheme: swift-crypto-Package
      macos_swift_versions: '["6.1", "6.2", "6.3"]'
      macos_xcode_versions: '["latest-beta"]'
      # A bare list takes every target's defaults: build, and do not test.
      xcode_targets: '[macOS, iOS, watchOS, tvOS, visionOS]'

      # Job kinds that were a workflow each.
      linux_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      windows_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      enable_cxx_interop: true
      enable_linux_static_sdk_build: true

  # No unified equivalent: this also asserts the CMakeLists are current, which
  # cmake_build.yml has no counterpart for, so it stays where it is.
  cmake-checks:
    name: CMake checks
    uses: apple/swift-nio/.github/workflows/cmake_tests.yml@main
    with:
      update_cmake_lists_config: >-
        {
          "targets": [
            { "name": "CCryptoBoringSSL", "type": "source", "exceptions": [] },
            { "name": "CCryptoBoringSSLShims", "type": "source", "exceptions": [] },
            { "name": "CryptoBoringWrapper", "type": "source", "exceptions": [] },
            { "name": "CXKCP", "type": "source", "exceptions": [] },
            { "name": "CXKCPShims", "type": "source", "exceptions": [] },
            { "name": "Crypto", "type": "source", "exceptions": [] },
            { "name": "CryptoExtras", "type": "source", "exceptions": [] },
            { "name": "CCryptoBoringSSL", "type": "assembly", "exceptions": [ "*/AES/*.swift" ] }
          ]
        }
